# Season Restaurant Reservation System - Render.com Deployment Configuration
# https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: season-reservas
    runtime: python
    plan: standard
    pythonVersion: "3.11.9"

    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --worker-class=gthread --threads=4 --timeout=120 wsgi:app

    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FLASK_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: WHATSAPP_NUMBER
        value: "689135630"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: RENDER
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.9"
